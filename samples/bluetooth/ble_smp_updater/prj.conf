# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_BM_UARTE=y

# SoftDevice: its API headers and its image. The sample forwards the stack's
# interrupts and polls its events itself, without the SoftDevice handler library.
CONFIG_SOFTDEVICE=y
CONFIG_NRF_SDH=n

# Random seed for the stack
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

CONFIG_REBOOT=y

# Link into the 128 kB code partition, below the update slot
CONFIG_USE_DT_CODE_PARTITION=y
